<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자연어 기반 온실 예비설계 시스템</title>

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f6f8fb;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #111827;
    }

    .wrap {
      max-width: 1500px;
      margin: 0 auto;
      padding: 18px;
    }

    .header {
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
      color: white;
      padding: 26px 32px;
      border-radius: 18px;
      margin-bottom: 18px;
      border-bottom: 4px solid #93c5fd;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 900;
    }

    .header p {
      margin: 8px 0 0;
      color: #dbeafe;
      font-size: 15px;
      font-weight: 500;
    }

    .nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .nav button {
      border: 1px solid #cbd5e1;
      background: white;
      padding: 14px 8px;
      border-radius: 12px;
      font-weight: 900;
      cursor: pointer;
      font-size: 14px;
      color: #111827;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.05);
    }

    .nav button.active {
      background: #1d4ed8;
      color: white;
      border-color: #1d4ed8;
    }

    .grid {
      display: grid;
      grid-template-columns: 0.38fr 0.62fr;
      gap: 18px;
    }

    .grid-reverse {
      display: grid;
      grid-template-columns: 0.42fr 0.58fr;
      gap: 18px;
    }

    .card {
      background: white;
      border: 1px solid #d1d5db;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 900;
      margin: 0 0 12px 0;
      color: #111827;
    }

    .hint {
      background: #eef2ff;
      border-left: 5px solid #2563eb;
      padding: 12px 14px;
      border-radius: 10px;
      margin: 10px 0 16px 0;
      font-size: 14px;
      line-height: 1.6;
      color: #1f2937;
    }

    .warn {
      background: #fef3c7;
      border-left: 5px solid #d97706;
      padding: 12px 14px;
      border-radius: 10px;
      margin: 10px 0 16px 0;
      font-size: 14px;
      line-height: 1.6;
    }

    .ok {
      background: #d1fae5;
      border-left: 5px solid #059669;
      padding: 12px 14px;
      border-radius: 10px;
      margin: 10px 0 16px 0;
      font-size: 14px;
      line-height: 1.6;
      color: #064e3b;
    }

    .bad {
      background: #fee2e2;
      border-left: 5px solid #dc2626;
      padding: 12px 14px;
      border-radius: 10px;
      margin: 10px 0 16px 0;
      font-size: 14px;
      line-height: 1.6;
      color: #7f1d1d;
    }

    textarea, input, select {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      margin: 6px 0 12px 0;
      background: white;
    }

    label {
      font-weight: 900;
      font-size: 14px;
      display: block;
      margin-top: 6px;
    }

    .primary {
      background: #1d4ed8;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 13px 16px;
      font-weight: 900;
      cursor: pointer;
      width: 100%;
      font-size: 15px;
    }

    .subbtn {
      background: #e0e7ff;
      color: #1e3a8a;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 11px 14px;
      font-weight: 900;
      cursor: pointer;
      width: 100%;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .metrics3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
      min-height: 82px;
    }

    .metric span {
      display: block;
      color: #64748b;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .metric b {
      display: block;
      font-size: 22px;
      color: #0f172a;
      font-weight: 900;
      line-height: 1.25;
    }

    .metric small {
      display: block;
      margin-top: 6px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.45;
    }

    .big-result {
      background: linear-gradient(135deg, #eff6ff, #ffffff);
      border: 1px solid #bfdbfe;
      border-radius: 18px;
      padding: 20px 22px;
      margin-bottom: 16px;
    }

    .big-result h2 {
      font-size: 25px;
      font-weight: 900;
      color: #0f172a;
      margin: 0 0 8px 0;
    }

    .big-result p {
      font-size: 15px;
      color: #334155;
      line-height: 1.6;
      margin: 0;
    }

    .pill {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1e40af;
      font-size: 13px;
      font-weight: 900;
      margin-right: 6px;
      margin-bottom: 6px;
    }

    hr {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 18px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      background: white;
    }

    th, td {
      border: 1px solid #e5e7eb;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #f8fafc;
      font-weight: 900;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    #model3d, #model3dAnalysis {
      width: 100%;
      height: 680px;
    }

    @media (max-width: 1000px) {
      .nav {
        grid-template-columns: 1fr;
      }

      .grid, .grid-reverse {
        grid-template-columns: 1fr;
      }

      .metrics, .metrics3 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header">
      <h1>자연어 기반 온실 예비설계 시스템</h1>
      <p>지역·작물·규모를 자연어로 입력하면 추천안·3D 모델·하중조건·구조검토를 단계별로 생성합니다.</p>
    </div>

    <div class="nav">
      <button id="nav-design" class="active" onclick="showScreen('design')">1. 설계 조건</button>
      <button id="nav-recommend" onclick="showScreen('recommend')">2. 추천안 · 3D 모델</button>
      <button id="nav-load" onclick="showScreen('load')">3. 하중 조건</button>
      <button id="nav-analysis" onclick="showScreen('analysis')">4. 구조해석</button>
      <button id="nav-safety" onclick="showScreen('safety')">5. 구조 설계</button>
    </div>

    <section id="screen-design" class="screen active">
      <div class="grid">
        <div class="card">
          <h2 class="section-title">1. 설계 조건</h2>
          <div class="hint">
            <b>입력 예시</b><br />
            포항에서 딸기 재배용으로 100평 규모 온실 추천해줘
          </div>

          <label>자연어 입력</label>
          <textarea id="prompt" rows="7">포항에서 딸기 재배용으로 100평 규모 온실 추천해줘</textarea>

          <button class="primary" onclick="runDesign()">AI 추천안 생성</button>
        </div>

        <div class="card">
          <h2 class="section-title">조건 추출 결과</h2>
          <div id="parsedResult" class="hint">왼쪽에 자연어 조건을 입력하고 AI 추천안 생성을 눌러주세요.</div>
        </div>
      </div>
    </section>

    <section id="screen-recommend" class="screen">
      <div id="recommendContent" class="hint">아직 추천안이 생성되지 않았습니다.</div>
    </section>

    <section id="screen-load" class="screen">
      <div id="loadContent" class="hint">아직 추천안이 생성되지 않았습니다.</div>
    </section>

    <section id="screen-analysis" class="screen">
      <div id="analysisContent" class="hint">하중 계산을 먼저 실행하세요.</div>
    </section>

    <section id="screen-safety" class="screen">
      <div id="safetyContent" class="hint">하중 계산을 먼저 실행하세요.</div>
    </section>
  </div>

  <script>
    let designResult = null;
    let loadResult = null;
    let analysisResult = null;
    let safetyResult = null;

    function showScreen(name) {
      const screens = ["design", "recommend", "load", "analysis", "safety"];

      screens.forEach(s => {
        document.getElementById("screen-" + s).classList.remove("active");
        document.getElementById("nav-" + s).classList.remove("active");
      });

      document.getElementById("screen-" + name).classList.add("active");
      document.getElementById("nav-" + name).classList.add("active");

      if (name === "recommend" && designResult) {
        drawGreenhouse("model3d", designResult);
      }

      if (name === "analysis" && designResult && designResult.drawingReady) {
        drawGreenhouse("model3dAnalysis", designResult);
      }
    }

    function fmt(x, n = 2) {
      if (typeof x !== "number") return x;
      return Number(x).toFixed(n);
    }

    function metric(title, value, note = "") {
      return `
        <div class="metric">
          <span>${title}</span>
          <b>${value}</b>
          ${note ? `<small>${note}</small>` : ""}
        </div>
      `;
    }

    function parseRequest(text) {
      const regions = [
        "포항", "경주", "김천", "안동", "구미", "영주", "영천", "상주", "문경", "경산",
        "평창", "대관령", "강릉", "원주", "춘천",
        "수원", "화성", "평택", "이천", "안성", "용인",
        "천안", "아산", "논산", "부여", "공주",
        "청주", "충주", "제천", "음성", "진천",
        "전주", "익산", "김제", "정읍", "남원",
        "나주", "순천", "여수", "담양", "해남", "무안",
        "창원", "진주", "밀양", "김해", "거창", "합천",
        "서귀포", "제주시",
        "서울", "부산", "대구", "인천", "광주", "대전", "울산", "세종",
        "경기", "강원", "충북", "충청북도", "충남", "충청남도",
        "전북", "전라북도", "전남", "전라남도",
        "경북", "경상북도", "경남", "경상남도", "제주"
      ];

      const cropAlias = {
        "방울토마토": "토마토",
        "딸기": "딸기",
        "토마토": "토마토",
        "파프리카": "파프리카",
        "상추": "상추",
        "오이": "오이",
        "고추": "고추",
        "멜론": "멜론",
        "참외": "참외",
        "화훼": "화훼",
        "엽채류": "엽채류"
      };

      let region = "";
      for (const r of regions) {
        if (text.includes(r)) {
          region = r;
          break;
        }
      }

      if (!region) {
        const m = text.match(/([가-힣]{2,10})(?:에서|에|지역에서|지역에)/);
        if (m) region = m[1];
      }

      let crop = "";
      for (const key of Object.keys(cropAlias)) {
        if (text.includes(key)) {
          crop = cropAlias[key];
          break;
        }
      }

      let areaValue = 0;
      let areaUnit = "";
      let areaM2 = 0;

      const areaMatch = text.match(/(\d+(?:\.\d+)?)\s*(평|평형|m2|㎡|제곱미터|m²)/i);

      if (areaMatch) {
        areaValue = parseFloat(areaMatch[1]);
        areaUnit = areaMatch[2];

        if (areaUnit === "평" || areaUnit === "평형") {
          areaM2 = areaValue * 3.3058;
        } else {
          areaM2 = areaValue;
        }
      }

      const missing = [];
      if (!region) missing.push("지역");
      if (!crop) missing.push("작물");
      if (areaM2 <= 0) missing.push("규모");

      return {
        text,
        region,
        crop,
        areaValue,
        areaUnit,
        areaM2,
        missing
      };
    }

    function recommendDesign(parsed) {
      if (parsed.missing.length > 0) {
        return null;
      }

      const region = parsed.region;
      const crop = parsed.crop;
      const areaM2 = parsed.areaM2;
      const areaPyung = areaM2 / 3.3058;

      let baseSingle, baseMulti, widthPerSpan, eaveHeight, ridgeHeight, frameSpacing, member, covering, reasonCrop;

      if (["딸기", "상추", "엽채류"].includes(crop)) {
        baseSingle = "단동 아치형 온실";
        baseMulti = "연동 아치형 온실";
        widthPerSpan = 8.0;
        eaveHeight = 2.8;
        ridgeHeight = 4.2;
        frameSpacing = 0.6;
        member = "Ø31.8 × 1.5t";
        covering = "PO 필름 또는 장기성 필름";
        reasonCrop = "저상 재배 및 비교적 낮은 내부 공간 조건에 적합합니다.";
      } else if (["토마토", "파프리카", "오이"].includes(crop)) {
        baseSingle = "고측고 단동 온실";
        baseMulti = "고측고 연동형 온실";
        widthPerSpan = 8.0;
        eaveHeight = 4.0;
        ridgeHeight = 5.8;
        frameSpacing = 0.6;
        member = "Ø42.7 × 2.1t";
        covering = "PO 필름 또는 경질 피복재 검토";
        reasonCrop = "작물 높이와 작업 공간을 고려하여 높은 측고가 유리합니다.";
      } else if (["고추", "멜론", "참외"].includes(crop)) {
        baseSingle = "단동 아치형 온실";
        baseMulti = "연동 아치형 온실";
        widthPerSpan = 8.0;
        eaveHeight = 3.0;
        ridgeHeight = 4.6;
        frameSpacing = 0.6;
        member = "Ø31.8 × 1.5t 또는 Ø42.7 × 2.1t";
        covering = "PO 필름";
        reasonCrop = "중간 높이 작물로 단동형과 연동형 모두 적용 가능합니다.";
      } else {
        baseSingle = "검토형 단동 온실";
        baseMulti = "검토형 연동 온실";
        widthPerSpan = 8.0;
        eaveHeight = 3.0;
        ridgeHeight = 4.5;
        frameSpacing = 0.6;
        member = "검토 필요";
        covering = "작물 특성에 따라 검토";
        reasonCrop = "작물별 생육 조건을 추가 검토해야 합니다.";
      }

      let spanCount;
      if (areaM2 <= 400) spanCount = 1;
      else if (areaM2 <= 800) spanCount = 2;
      else if (areaM2 <= 1200) spanCount = 3;
      else spanCount = Math.ceil(areaM2 / 400);

      let totalWidth = widthPerSpan * spanCount;
      let designLength = areaM2 / totalWidth;

      if (designLength < 20) {
        designLength = 20;
        spanCount = Math.max(1, Math.ceil(areaM2 / (designLength * widthPerSpan)));
        totalWidth = spanCount * widthPerSpan;
      }

      if (designLength > 80) {
        designLength = 60;
        spanCount = Math.max(1, Math.ceil(areaM2 / (designLength * widthPerSpan)));
        totalWidth = spanCount * widthPerSpan;
      }

      const frameCount = Math.floor(designLength / frameSpacing) + 1;
      const estimatedArea = totalWidth * designLength;

      let regionNote;
      if (["포항", "부산", "울산", "제주", "서귀포", "제주시"].includes(region)) {
        regionNote = "해안 또는 강풍 영향 가능성이 있어 풍하중 검토를 우선 고려하는 것이 좋습니다.";
      } else if (["강원", "평창", "대관령"].includes(region)) {
        regionNote = "적설 영향이 큰 지역일 수 있으므로 적설하중 검토를 우선 고려하는 것이 좋습니다.";
      } else if (["대구", "경북", "영천", "경주", "구미", "안동"].includes(region)) {
        regionNote = "내륙 지역 특성을 고려하여 풍하중과 적설하중을 함께 검토하는 것이 좋습니다.";
      } else {
        regionNote = "지역별 기본풍속 및 적설하중 기준값을 확인하여 구조검토가 필요합니다.";
      }

      let Cpe, cpeWindward = 0.7, cpeLeeward = -0.5, coeffNote;

      if (["토마토", "파프리카", "오이"].includes(crop)) {
        Cpe = -0.8;
        coeffNote = "고측고 온실은 지붕부 흡입압 영향이 커질 수 있어 지붕부 외압계수를 보수적으로 적용했습니다.";
      } else if (spanCount >= 2) {
        Cpe = -0.8;
        coeffNote = "연동형 온실은 지붕부와 연동부 주변 풍압 검토가 중요하므로 지붕부 흡입압 기준으로 선정했습니다.";
      } else {
        Cpe = -0.7;
        coeffNote = "단동 아치형 온실의 예비검토용 대표 지붕부 외압계수로 선정했습니다.";
      }

      const CpiCandidates = [-0.2, 0.2];
      let Cpi = 0.2;
      let netCp = Cpe - Cpi;

      CpiCandidates.forEach(candidate => {
        const temp = Cpe - candidate;
        if (Math.abs(temp) > Math.abs(netCp)) {
          Cpi = candidate;
          netCp = temp;
        }
      });

      const greenhouseType = spanCount === 1 ? baseSingle : `${spanCount}연동 ${baseMulti}`;

      return {
        parsed,
        greenhouseType,
        region,
        crop,
        areaPyung,
        areaM2,
        totalWidth,
        designLength,
        estimatedArea,
        spanCount,
        eaveHeight,
        ridgeHeight,
        frameSpacing,
        frameCount,
        member,
        covering,
        reasonCrop,
        regionNote,
        Cpe,
        Cpi,
        netCp,
        cpeWindward,
        cpeLeeward,
        coeffNote,
        drawingReady: true
      };
    }

    function runDesign() {
      const text = document.getElementById("prompt").value;
      const parsed = parseRequest(text);
      const rec = recommendDesign(parsed);

      if (parsed.missing.length > 0) {
        document.getElementById("parsedResult").innerHTML = `
          <div class="warn"><b>부족한 조건:</b> ${parsed.missing.join(", ")}<br>
          예시: 포항에서 딸기 재배용으로 100평 규모 온실 추천해줘</div>
        `;
        return;
      }

      designResult = rec;
      loadResult = null;
      analysisResult = null;
      safetyResult = null;

      document.getElementById("parsedResult").innerHTML = `
        <div class="metrics">
          ${metric("지역", parsed.region)}
          ${metric("작물", parsed.crop)}
          ${metric("입력 규모", `${parsed.areaValue} ${parsed.areaUnit}`)}
          ${metric("환산 면적", `${fmt(parsed.areaM2, 2)} m²`)}
        </div>
        <div class="ok">지역, 작물, 규모가 모두 추출되었습니다.</div>
        <h3>입력 문장</h3>
        <p>${parsed.text}</p>
      `;

      renderRecommend();
      renderLoad();
      renderAnalysis();
      renderSafety();

      showScreen("recommend");
    }

    function renderRecommend() {

    function drawGreenhouse(divId, r) {
      const div = document.getElementById(divId);
      if (!div || !r) return;

      const traces = [];

      const totalWidth = r.totalWidth;
      const designLength = r.designLength;
      const eaveHeight = r.eaveHeight;
      const ridgeHeight = r.ridgeHeight;
      const spanCount = r.spanCount;
      const frameCount = r.frameCount;
      const roofRise = ridgeHeight - eaveHeight;
      const bayWidth = totalWidth / spanCount;

      function addLine(xs, ys, zs, width = 4) {
        traces.push({
          x: xs,
          y: ys,
          z: zs,
          mode: "lines",
          type: "scatter3d",
          showlegend: false,
          line: { width }
        });
      }

      function archZ(y, y0, y1) {
        const center = (y0 + y1) / 2;
        const half = (y1 - y0) / 2;
        if (half === 0) return eaveHeight;
        const ratio = (y - center) / half;
        return eaveHeight + roofRise * (1 - ratio * ratio);
      }

      const visibleFrames = Math.min(frameCount, 30);
      const xPositions = [];

      if (visibleFrames <= 1) {
        xPositions.push(0, designLength);
      } else {
        for (let i = 0; i < visibleFrames; i++) {
          xPositions.push(designLength * i / (visibleFrames - 1));
        }
      }

      xPositions.forEach(x => {
        for (let s = 0; s < spanCount; s++) {
          const y0 = s * bayWidth;
          const y1 = (s + 1) * bayWidth;

          addLine([x, x], [y0, y0], [0, eaveHeight], 4);
          addLine([x, x], [y1, y1], [0, eaveHeight], 4);

          const xs = [];
          const ys = [];
          const zs = [];

          for (let i = 0; i <= 30; i++) {
            const y = y0 + (y1 - y0) * i / 30;
            xs.push(x);
            ys.push(y);
            zs.push(archZ(y, y0, y1));
          }

          addLine(xs, ys, zs, 4);
        }
      });

      for (let s = 0; s < spanCount; s++) {
        const y0 = s * bayWidth;
        const y1 = (s + 1) * bayWidth;

        [y0, y1].forEach(y => {
          addLine([0, designLength], [y, y], [eaveHeight, eaveHeight], 3);
        });

        [0.25, 0.5, 0.75].forEach(frac => {
          const y = y0 + bayWidth * frac;
          const z = archZ(y, y0, y1);
          addLine([0, designLength], [y, y], [z, z], 3);
        });
      }

      addLine(
        [0, designLength, designLength, 0, 0],
        [0, 0, totalWidth, totalWidth, 0],
        [0, 0, 0, 0, 0],
        2
      );

      const layout = {
        title: `3D 온실 설계 모델 - ${r.greenhouseType}`,
        height: 680,
        margin: { l: 0, r: 0, t: 50, b: 0 },
        scene: {
          xaxis: { title: "길이 X [m]" },
          yaxis: { title: "폭 Y [m]" },
          zaxis: { title: "높이 Z [m]" },
          aspectmode: "data",
          camera: { eye: { x: 1.6, y: 1.4, z: 0.9 } }
        }
      };

      Plotly.newPlot(divId, traces, layout, { responsive: true });
    }

    function renderLoad() {
      if (!designResult) {
        document.getElementById("loadContent").innerHTML = `<div class="hint">아직 추천안이 생성되지 않았습니다.</div>`;
        return;
      }

      const r = designResult;

      let defaultV = 30;
      let defaultSnow = 0.5;

      if (["포항", "부산", "울산", "제주", "서귀포", "제주시"].includes(r.region)) {
        defaultV = 35;
      }

      if (["강원", "평창", "대관령"].includes(r.region)) {
        defaultSnow = 1.2;
      } else if (["제주", "서귀포", "제주시"].includes(r.region)) {
        defaultSnow = 0.3;
      }

      document.getElementById("loadContent").innerHTML = `
        <h2 class="section-title">하중 조건</h2>
        <div class="hint">
          추천안에서 자동 선정된 풍압계수와 지역별 기본 하중값을 초기값으로 불러옵니다.
          필요하면 사용자가 직접 값을 수정한 뒤 하중을 다시 계산할 수 있습니다.
        </div>

        <div class="grid-reverse">
          <div class="card">
            <h3>하중 입력값</h3>

            <label>기본풍속 V [m/s]</label>
            <input id="loadV" type="number" step="1" value="${defaultV}" />

            <label>고정하중 D [kN/m²]</label>
            <input id="loadD" type="number" step="0.01" value="0.15" />

            <label>지상적설하중 Sg [kN/m²]</label>
            <input id="loadSg" type="number" step="0.1" value="${defaultSnow}" />

            <label>지붕형상계수 μ</label>
            <input id="loadMu" type="number" step="0.05" value="0.8" />

            <label>프레임 간격 s [m]</label>
            <input id="loadSpacing" type="number" step="0.1" value="${r.frameSpacing}" />

            <hr />

            <h3>풍압계수</h3>
            <p>초기값은 2번 추천안에서 자동 선정된 외압계수와 내압계수입니다.</p>

            <button class="subbtn" onclick="resetWindCoeff()">추천 풍압계수 다시 불러오기</button>

            <label>외압계수 Cpe</label>
            <input id="loadCpe" type="number" step="0.1" value="${r.Cpe}" oninput="updateNetCp()" />

            <label>내압계수 Cpi</label>
            <input id="loadCpi" type="number" step="0.1" value="${r.Cpi}" oninput="updateNetCp()" />

            <div id="netCpInfo" class="hint">현재 순압계수 Cpe - Cpi = ${fmt(r.Cpe - r.Cpi, 2)}</div>

            <button class="primary" onclick="runLoadCalc()">하중 계산 실행</button>
          </div>

          <div class="card">
            <h3>하중 계산 결과</h3>
            <div id="loadResultBox" class="hint">왼쪽에서 하중 조건을 확인한 뒤 하중 계산 실행을 눌러주세요.</div>
          </div>
        </div>
      `;
    }

    function updateNetCp() {
      const Cpe = parseFloat(document.getElementById("loadCpe").value);
      const Cpi = parseFloat(document.getElementById("loadCpi").value);
      document.getElementById("netCpInfo").innerHTML = `현재 순압계수 Cpe - Cpi = ${fmt(Cpe - Cpi, 2)}`;
    }

    function resetWindCoeff() {
      if (!designResult) return;
      document.getElementById("loadCpe").value = designResult.Cpe;
      document.getElementById("loadCpi").value = designResult.Cpi;
      updateNetCp();
    }

    function computeLoadResult(V, deadLoad, groundSnow, mu, spacing, Cpe, Cpi) {
      const rho = 1.225;
      const netCp = Cpe - Cpi;
      const qPa = 0.5 * rho * V * V;
      const qKn = qPa / 1000;

      const windPressure = qKn * netCp;
      const windLine = Math.abs(windPressure) * spacing;

      const roofSnow = groundSnow * mu;
      const deadLine = deadLoad * spacing;
      const snowLine = roofSnow * spacing;

      const lc1 = deadLine;
      const lc2 = deadLine + snowLine;
      const lc3 = Math.max(windLine - deadLine, 0);
      const lc4 = deadLine + snowLine + windLine;

      return {
        V,
        rho,
        qKn,
        Cpe,
        Cpi,
        netCp,
        windPressure,
        windLine,
        deadLoad,
        deadLine,
        groundSnow,
        mu,
        roofSnow,
        snowLine,
        lc1,
        lc2,
        lc3,
        lc4
      };
    }

    function runLoadCalc() {
      const V = parseFloat(document.getElementById("loadV").value);
      const D = parseFloat(document.getElementById("loadD").value);
      const Sg = parseFloat(document.getElementById("loadSg").value);
      const mu = parseFloat(document.getElementById("loadMu").value);
      const spacing = parseFloat(document.getElementById("loadSpacing").value);
      const Cpe = parseFloat(document.getElementById("loadCpe").value);
      const Cpi = parseFloat(document.getElementById("loadCpi").value);

      loadResult = computeLoadResult(V, D, Sg, mu, spacing, Cpe, Cpi);
      analysisResult = computeStructuralAnalysis(designResult, loadResult);
      safetyResult = null;

      document.getElementById("loadResultBox").innerHTML = `
        <div class="metrics3">
          ${metric("풍하중 선하중", `${fmt(loadResult.windLine, 4)} kN/m`, `Cpe-Cpi = ${fmt(loadResult.netCp, 2)}`)}
          ${metric("적설하중 선하중", `${fmt(loadResult.snowLine, 4)} kN/m`, `지붕적설 = ${fmt(loadResult.roofSnow, 4)} kN/m²`)}
          ${metric("고정하중 선하중", `${fmt(loadResult.deadLine, 4)} kN/m`, `D = ${fmt(loadResult.deadLoad, 2)} kN/m²`)}
        </div>

        <h3>하중조합</h3>
        <table>
          <tr>
            <th>LC1 D</th>
            <th>LC2 D+S</th>
            <th>LC3 W-D 상향</th>
            <th>LC4 D+S+W</th>
          </tr>
          <tr>
            <td>${fmt(loadResult.lc1, 4)}</td>
            <td>${fmt(loadResult.lc2, 4)}</td>
            <td>${fmt(loadResult.lc3, 4)}</td>
            <td>${fmt(loadResult.lc4, 4)}</td>
          </tr>
        </table>
      `;

      renderAnalysis();
      renderSafety();
    }

    function computeStructuralAnalysis(r, load) {
      const spanWidth = r.totalWidth / r.spanCount;
      const wVertical = load.lc2;
      const wWind = load.windLine;
      const wUplift = load.lc3;

      const maxShear = wVertical * spanWidth / 2;
      const maxMoment = wVertical * spanWidth * spanWidth / 8;

      const upliftShear = wUplift * spanWidth / 2;
      const upliftMoment = wUplift * spanWidth * spanWidth / 8;

      const lateralShear = wWind * r.ridgeHeight;
      const overturningMoment = wWind * r.ridgeHeight * r.ridgeHeight / 2;
      const governingMoment = Math.max(maxMoment, upliftMoment);

      return {
        spanWidth,
        wVertical,
        maxShear,
        maxMoment,
        upliftShear,
        upliftMoment,
        lateralShear,
        overturningMoment,
        governingMoment
      };
    }

    function renderAnalysis() {
      if (!loadResult || !analysisResult) {
        document.getElementById("analysisContent").innerHTML = `<div class="hint">3번 하중 조건 화면에서 하중 계산을 먼저 실행하세요.</div>`;
        return;
      }

      const a = analysisResult;

      document.getElementById("analysisContent").innerHTML = `
        <h2 class="section-title">구조해석</h2>

        <div class="metrics">
          ${metric("검토 경간", `${fmt(a.spanWidth, 3)} m`)}
          ${metric("최대 전단력", `${fmt(a.maxShear, 4)} kN`)}
          ${metric("최대 휨모멘트", `${fmt(a.maxMoment, 4)} kN·m`)}
          ${metric("지배 휨모멘트", `${fmt(a.governingMoment, 4)} kN·m`)}
        </div>

        <div class="grid">
          <div class="card">
            <h2 class="section-title">3D 모델</h2>
            <div id="model3dAnalysis"></div>
          </div>

          <div class="card">
            <h2 class="section-title">해석 결과</h2>
            <p><b>해석 방식:</b> 1개 연동 폭을 단순보 등가 경간으로 가정한 예비 구조해석</p>
            <p><b>지배 수직하중 D+S:</b> ${fmt(a.wVertical, 4)} kN/m</p>
            <p><b>상향 풍하중 전단력:</b> ${fmt(a.upliftShear, 4)} kN</p>
            <p><b>상향 풍하중 모멘트:</b> ${fmt(a.upliftMoment, 4)} kN·m</p>
            <p><b>풍하중 수평전단 예비값:</b> ${fmt(a.lateralShear, 4)} kN</p>
            <p><b>풍하중 전도모멘트 예비값:</b> ${fmt(a.overturningMoment, 4)} kN·m</p>

            <div class="warn">
              현재 구조해석은 1개 온실 폭을 단순보 등가 경간으로 가정한 예비해석입니다.
              최종 단계에서는 실제 프레임 절점·부재 기반 구조해석으로 확장해야 합니다.
            </div>
          </div>
        </div>
      `;

      setTimeout(() => drawGreenhouse("model3dAnalysis", designResult), 100);
    }

    function pipeProperties(member) {
      let D, t;

      if (member.includes("42.7")) {
        D = 0.0427;
        t = 0.0021;
      } else {
        D = 0.0318;
        t = 0.0015;
      }

      const d = D - 2 * t;
      const A = Math.PI / 4 * (D * D - d * d);
      const I = Math.PI / 64 * (Math.pow(D, 4) - Math.pow(d, 4));
      const Z = I / (D / 2);

      return { D, t, A, I, Z };
    }

    function computeSafety(member) {
      const p = pipeProperties(member);

      const sigmaAllow = 150000;
      const E = 200000000;
      const K = 1.0;
      const span = analysisResult.spanWidth;
      const Le = Math.max(span / 2, 1.0);

      const momentCapacity = sigmaAllow * p.Z;
      const momentRatio = analysisResult.governingMoment / momentCapacity;

      const pcr = Math.PI * Math.PI * E * p.I / Math.pow(K * Le, 2);
      const bucklingRatio = analysisResult.maxShear / pcr;

      const utilization = Math.max(momentRatio, bucklingRatio);

      let status, note;

      if (utilization <= 0.7) {
        status = "OK";
        note = "예비 안정성 검토상 여유가 있는 설계안입니다.";
      } else if (utilization <= 1.0) {
        status = "주의";
        note = "예비 안정성 검토상 한계에 가까운 설계안입니다. 부재 보강 또는 간격 조정 검토가 필요합니다.";
      } else {
        status = "NG";
        note = "예비 안정성 검토상 허용 범위를 초과합니다. 부재 규격 상향 또는 프레임 간격 축소가 필요할 수 있습니다.";
      }

      return {
        member,
        ...p,
        momentCapacity,
        momentRatio,
        pcr,
        bucklingRatio,
        utilization,
        status,
        note
      };
    }

    function renderSafety() {
      if (!loadResult || !analysisResult) {
        document.getElementById("safetyContent").innerHTML = `<div class="hint">3번 하중 조건 화면에서 하중 계산을 먼저 실행하세요.</div>`;
        return;
      }

      const defaultMember = designResult.member.includes("42.7") ? "Ø42.7 × 2.1t" : "Ø31.8 × 1.5t";

      document.getElementById("safetyContent").innerHTML = `
        <h2 class="section-title">구조 설계(안정성 검토)</h2>

        <div class="grid">
          <div class="card">
            <h3>부재 선택</h3>

            <label>검토할 강관 부재</label>
            <select id="safetyMember">
              <option value="Ø31.8 × 1.5t" ${defaultMember.includes("31.8") ? "selected" : ""}>Ø31.8 × 1.5t</option>
              <option value="Ø42.7 × 2.1t" ${defaultMember.includes("42.7") ? "selected" : ""}>Ø42.7 × 2.1t</option>
            </select>

            <button class="primary" onclick="runSafety()">안정성 검토 실행</button>
          </div>

          <div class="card">
            <h3>안정성 검토 결과</h3>
            <div id="safetyResultBox" class="hint">왼쪽에서 부재를 선택한 뒤 안정성 검토 실행을 눌러주세요.</div>
          </div>
        </div>
      `;
    }

    function runSafety() {
      const member = document.getElementById("safetyMember").value;
      safetyResult = computeSafety(member);

      const s = safetyResult;
      let boxClass = "ok";
      if (s.status === "주의") boxClass = "warn";
      if (s.status === "NG") boxClass = "bad";

      document.getElementById("safetyResultBox").innerHTML = `
        <div class="metrics3">
          ${metric("휨 검토비", fmt(s.momentRatio, 4))}
          ${metric("좌굴 검토비", fmt(s.bucklingRatio, 4))}
          ${metric("최대 활용률", fmt(s.utilization, 4))}
        </div>

        <div class="${boxClass}">
          <b>판정: ${s.status}</b><br />
          ${s.note}
        </div>

        <h3>검토 부재 정보</h3>
        <p><b>검토 부재:</b> ${s.member}</p>
        <p><b>파이프 외경:</b> ${fmt(s.D * 1000, 1)} mm</p>
        <p><b>파이프 두께:</b> ${fmt(s.t * 1000, 2)} mm</p>
        <p><b>예비 휨내력:</b> ${fmt(s.momentCapacity, 4)} kN·m</p>
        <p><b>Euler 좌굴하중:</b> ${fmt(s.pcr, 4)} kN</p>
      `;
    }
  </script>
</body>
